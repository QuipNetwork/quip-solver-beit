[package]
name = "quip-solver-beit"
version = "0.3.0-rc2"
edition = "2021"
description = "BEIT cloud heuristic-sampler Ising solver (BEITUnconstrainedSampler)"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/quip.network/quip-solver-beit"
rust-version = "1.97"

[lib]
name = "quip_solver_beit"
path = "src/lib.rs"

[[bin]]
name = "quip-beit-sa"
path = "src/bin/quip_beit_sa.rs"

# Single-crate package, so lints live here rather than in [workspace.lints].
[lints.rust]
nonstandard-style     = "warn"
redundant-lifetimes   = "warn"
rust-2018-idioms      = "deny"
unreachable-pub       = "warn"
unsafe-code           = "deny"
unused-extern-crates  = "warn"
unused-imports        = "warn"
unused-must-use       = "warn"
unused-qualifications = "warn"

[lints.clippy]
panic                 = "deny"
panic-in-result-fn    = "deny"
unimplemented         = "deny"
allow-attributes      = "deny"
dbg-macro             = "warn"
todo                  = "deny"
print-stdout          = "deny"
print-stderr          = "deny"
redundant-clone       = "warn"
uninlined-format-args = "warn"
manual-string-new     = "warn"
use-self              = "warn"
await-holding-lock    = "deny"
large-futures         = "deny"
exit                  = "deny"
mem-forget            = "deny"
# unwrap-used is denied at the library/binary crate root (see lib.rs / bin),
# not here: integration tests are a separate crate and use expect/panic freely.

# The Quip solver contract, published from crates.io (quip.network/quip-solver-core).
# It re-exports quip-proto and quip-protocol, so depending on those directly
# would only pin a second copy of the same code.
[dependencies]
quip-solver-core = "0.0.3"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
